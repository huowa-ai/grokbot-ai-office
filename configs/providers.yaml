# configs/providers.yaml
version: 1
defaults:
  timeout_ms: 180000

providers:
  codex:
    auth: subscription
    command: ["codex", "exec", "--sandbox", "read-only", "--skip-git-repo-check", "-"]
    input: stdin
    safe_mode: "--sandbox read-only"

  codebuddy:
    auth: subscription
    command: ["codebuddy", "-p", "--permission-mode", "plan"]
    input: arg
    safe_mode: "--permission-mode plan"

  hermes:
    auth: subscription
    command: ["hermes", "-m", "gpt-5.6-sol", "--provider", "openai-codex", "-z"]
    input: arg
    safe_mode: "-z"

  openclaw:
    auth: subscription
    command: ["openclaw", "agent", "--local", "--message-file", "{file}", "--session-id", "grokbot-group"]
    input: file
    output_filter: "^\\["      # 去掉以 [ 开头的日志行
    safe_mode: "--local"

  deepseek:
    auth: api_key
    vendor: deepseek
    model: deepseek-chat
    key_env: DEEPSEEK_API_KEY

  ollama-local:
    auth: openai_compatible
    base_url: http://localhost:11434/v1
    model: qwen2.5:7b
    key_env: null

  # 去掉每行开头的「# 」即可启用。密钥只放在环境变量里，不要写进这个文件。
